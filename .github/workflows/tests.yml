name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      # One platform failing must not cancel the others: a cancelled job
      # uploads no bottle, and a formula that lands missing a bottle sends
      # every user on that platform down a source build.
      fail-fast: false
      matrix:
        # Each entry here becomes one bottle tag on the published formula:
        #
        #   macos-26          arm64_tahoe
        #   macos-15          arm64_sequoia
        #   ubuntu-latest     x86_64_linux
        #   ubuntu-24.04-arm  aarch64_linux
        #
        # Between them that is every platform Homebrew still calls tier 1,
        # and all four are standard runners - free on a public repo.
        #
        # Intel macOS is deliberately absent. The only images left for it
        # (macos-15-intel, macos-26-intel) are larger runners, which GitHub
        # bills by the minute even on a public repo, and Homebrew is winding
        # Intel down anyway. An Intel Mac still installs - it just builds
        # from source, which for a stack of pure-Python wheels is slow rather
        # than broken. Add the label here if that trade stops being worth it.
        os: [ macos-26, macos-15 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
          # ghcr.io/homebrew/brew:main is a multi-arch image, so the same
          # container runs here. ARM Linux has been tier 1 in Homebrew since
          # 5.0.0, and this runner is a standard one - free on a public repo.
          - os: ubuntu-24.04-arm
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
