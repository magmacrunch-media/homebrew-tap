# Calls the house conventions check, which lives in magmacrunch-media/.github.
#
# That host is PUBLIC, and a public repo's reusable workflows are callable from
# every repo in the org with no token.
#
# NO exclude-paths, unlike magmacrunch.com. The formulae here are generated by
# bump.yml, which is the same shape as that repo's eleven self-committing
# workflows, but they carry ZERO em dashes: checked per formula on 2026-10-13
# for magmascript, texastoast and magmacrunch. Package descriptions come from
# PyPI, so if one ever arrives with a dash this will fail a bump pull request,
# and that is worth knowing rather than hiding.
#
# `push` is limited to main deliberately. bump.yml force-pushes a `bump/`
# branch on every run, and checking those would mean a red tick on a branch
# that exists only to become a pull request. The pull_request trigger covers
# the same content once, at the point somebody is about to merge it.
#
# This repo is public, so the minutes are free. It is also outside the dev
# tree, cloned when needed, so nothing local watches it and this workflow is
# the only check that runs here without somebody remembering to run one.

name: conventions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventions:
    uses: magmacrunch-media/.github/.github/workflows/conventions-check.yml@main
