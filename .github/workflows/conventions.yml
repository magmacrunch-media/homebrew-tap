# Calls the house conventions check, which lives in magmacrunch-media/.github.
#
# That host is PUBLIC, and a public repo's reusable workflows are callable from
# every repo in the org with no token.
#
# THREE CHECKS FAIL AND ONE WARNS. AI attribution, CRLF in the index and a
# missing AGENTS.md are mechanical. Em dash density is counted and warned about
# rather than gated, because the house preference is against them used
# excessively in writing, which is a judgement rather than a rule. That also
# means the generated formulae here need no exclusions: bump.yml regenerates
# them from PyPI descriptions, and if one ever arrives with a dash this reports
# the number instead of blocking a release.
#
# `push` is limited to main deliberately. bump.yml force-pushes a `bump/`
# branch on every run, and checking those would mean a red tick on a branch
# that exists only to become a pull request. The pull_request trigger covers
# the same content once, where somebody is about to merge it.
#
# This repo is public, so the minutes are free. It is also OUTSIDE the dev tree,
# cloned when needed, so nothing local watches it and no pre-commit hook has
# ever been installed here. This is the only check that runs without somebody
# remembering to run one, which matters for a repo whose bump.yml went 38 runs
# red with nobody reading them.

name: conventions

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conventions:
    uses: magmacrunch-media/.github/.github/workflows/conventions-check.yml@main
