# Keeps the formulae level with PyPI.
#
# The tap has no way of noticing that a package it packages was released:
# dependabot here watches github-actions and nothing else. So the formulae only
# moved when someone remembered, and the gap that opens when nobody does is not
# academic - magmacrunch sat at 0.1.1 through a release, and texastoast at
# 0.1.3 for a good deal longer. A stale tap is worse than no tap, because
# `brew install` succeeds and hands over the wrong version.
#
# This does the mechanical half: point each formula at the newest sdist,
# regenerate its resources, open a pull request. The human half is reviewing it
# and running `brew pr-pull`, which is where the bottles get attached.

name: Bump formulae from PyPI

on:
  schedule:
    # Early enough that a bump is waiting before anyone looks, late enough that
    # a release published the evening before has settled on PyPI.
    - cron: "17 6 * * *"

  workflow_dispatch:
    inputs:
      formulae:
        description: Space-separated formula names, or empty for all of them
        required: false
        default: ""

  # Lets a release in a package's own repo push the bump rather than waiting up
  # to a day for the schedule. Nothing sends this yet; the trigger costs
  # nothing to carry, and wiring it up is one step in a publishing workflow.
  repository_dispatch:
    types: [formula-bump]

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1

      # setup-homebrew checks this repository out as a tap rather than into the
      # workspace, so every step below runs from there.
      - name: Look for new releases
        id: bump
        env:
          FORMULAE: ${{ inputs.formulae }}
        run: |
          set -euo pipefail
          cd "$(brew --repository "$GITHUB_REPOSITORY")"
          # An array, because shellcheck is right that bare ${FORMULAE} would
          # glob as readily as it splits. Empty input yields an empty array
          # and the script then does every formula, which is the default.
          read -ra names <<< "${FORMULAE}"
          python3 .github/scripts/pypi_bump.py "${names[@]}"

      # Homebrew's own resolver rather than a second-rate reimplementation of
      # it. This is also the step that fails loudly when a new release cannot
      # have its dependency graph resolved at all - better here than in a
      # bottle build, and far better than in someone's terminal.
      - name: Regenerate the resource blocks
        if: steps.bump.outputs.changed == 'true'
        env:
          FORMULAE: ${{ steps.bump.outputs.formulae }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cd "$(brew --repository "$GITHUB_REPOSITORY")"
          read -ra names <<< "${FORMULAE}"
          for formula in "${names[@]}"; do
            brew update-python-resources "${OWNER}/tap/${formula}"
          done

      # GITHUB_TOKEN cannot open this pull request, and could not have done
      # anything useful if it had. Both halves are worth stating, because
      # fixing only the one that shows in the log leaves the other.
      #
      # It cannot: the organisation has "Allow GitHub Actions to create and
      # approve pull requests" off, so createPullRequest is refused outright.
      # Every scheduled run from 2026-08-29 to 2026-10-05 therefore pushed its
      # branch, failed this one call, and left the branch behind - seven
      # abandoned bump/ branches and not a single pull request, while the
      # formulae drifted seven releases behind PyPI. Check it with
      #   gh api orgs/magmacrunch-media/actions/permissions/workflow
      # where can_approve_pull_request_reviews is the flag, and note it is set
      # per-repository as well, so both have to allow it.
      #
      # And it could not: a pull request opened with GITHUB_TOKEN starts no
      # workflow runs, so tests.yml would never fire, no bottles would be built
      # and `brew pr-pull` would have nothing to attach. Flipping the flag
      # alone buys an inert pull request needing a manual close-and-reopen.
      #
      # An App installation token is subject to neither limit. It also expires
      # with the run, which a PAT does not: TAP_PR_TOKEN was the alternative
      # written here first, and a fine-grained PAT is scoped to selected
      # repositories under an owner, so renaming the owner silently drops the
      # selection and the token 403s while still authenticating. That has
      # already happened twice in this organisation.
      #
      # RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY are organisation secrets at
      # visibility `all`, so there is no per-repo copy here to go stale, and
      # the App is installed on this repository with contents and pull-requests
      # write.
      - name: Check the App credentials are present and parseable
        if: steps.bump.outputs.changed == 'true'
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::RELEASE_APP_ID / RELEASE_APP_PRIVATE_KEY are not visible to this repository."
            echo "They are organization secrets on magmacrunch-media at visibility 'all'. Check with"
            echo "  gh api orgs/magmacrunch-media/actions/secrets"
            echo "and note a repo-level copy of the same name would TAKE PRECEDENCE over the org one:"
            echo "  gh secret list -R magmacrunch-media/homebrew-tap"
            exit 1
          fi
          # An emptiness check is not enough. The org private key has been
          # stored three times as a bare PEM body with its -----BEGIN and
          # -----END lines stripped off by the web form, which is accepted,
          # stored, and then dies in the mint step below as "DOMException
          # [DataError]: Invalid keyData" inside a Node stack trace that names
          # neither the secret nor the paste. magmacrunch.com's backup ran
          # broken for 27 days on exactly that while an emptiness-only check
          # passed every single run.
          case "$APP_KEY" in
            "-----BEGIN "*"-----END "*) ;;
            *)
              echo "::error::RELEASE_APP_PRIVATE_KEY is set but is not a PEM: no -----BEGIN/-----END armour."
              echo "A malformed value, not a missing one, and almost certainly a PEM body pasted into"
              echo "the web form without its armour lines. Re-set it from the file, never by paste:"
              echo "  gh secret set RELEASE_APP_PRIVATE_KEY --org magmacrunch-media --visibility all < key.pem"
              echo "PowerShell has no < redirection; use Get-Content key.pem -Raw | gh secret set ..."
              exit 1
              ;;
          esac

      - name: Mint a short-lived token
        id: app-token
        if: steps.bump.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: magmacrunch-media
          repositories: homebrew-tap

      - name: Open the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.bump.outputs.branch }}
          TITLE: ${{ steps.bump.outputs.title }}
        run: |
          set -euo pipefail
          cd "$(brew --repository "$GITHUB_REPOSITORY")"

          # The branch name is a function of the versions found, so a rerun
          # that finds the same releases lands on the same branch. That is what
          # keeps it updating one pull request instead of opening a new one
          # every morning - but it also means a blind force-push would throw
          # away anything a person had committed onto that branch in between.
          base=$(git rev-parse HEAD)
          git checkout -b "$BRANCH"
          git commit -am "$TITLE"

          push=true
          if git fetch --quiet origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"; then
            # This job leaves exactly one commit on top of main. More than that
            # means someone has been working here - a fixed test block, a
            # correction - and force-pushing would delete it silently.
            ahead=$(git rev-list --count "$base..origin/$BRANCH")
            if [ "$ahead" -gt 1 ]; then
              echo "::warning::$BRANCH carries $ahead commits on top of main, so someone has worked on it. Refusing to force-push over that. Merge or delete the branch to let this run again."
              exit 0
            fi

            # Same content as what is already pushed. Pushing anyway would give
            # the branch a new sha for no reason, and a new sha discards the
            # bottles this pull request's CI has already built - which is the
            # one thing `brew pr-pull` needs from it.
            if [ "$(git rev-parse "origin/$BRANCH^{tree}")" = "$(git rev-parse "HEAD^{tree}")" ]; then
              echo "$BRANCH already has exactly this content; leaving it and its CI alone."
              push=false
            fi
          fi

          if [ "$push" = true ]; then
            git push --force origin "$BRANCH"
          fi

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[]')" ]; then
            echo "Pull request for $BRANCH already open; updated the branch in place."
            exit 0
          fi

          gh pr create --head "$BRANCH" --base main \
            --title "$TITLE" --body-file .github/BUMP_PR_BODY.md

          # Opened by the App, so tests.yml has started and will build the
          # bottles. Attaching them is still deliberate rather than automatic:
          # run publish.yml with this pull request's number, which is
          # `brew pr-pull` and lands the formula on main with its bottle block
          # filled in. Merging the branch by hand instead is the one thing not
          # to do - the bump strips the old bottle block and the new version
          # has none yet, so a plain merge publishes a formula that sends every
          # user down a source build.
          echo "::notice::Opened by the magmacrunch-release App, so bottle CI has started. When it is green, run the 'brew pr-pull' workflow with this pull request number to land it. Do not merge the branch by hand: it carries no bottles."
